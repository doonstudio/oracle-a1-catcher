# 5 dakikada bir tanimli her Oracle hesabina bakar; kapasite varsa A1 sunucusunu acar.
# Hesaplar OCI_CONFIG_<n> + OCI_KEY_<n> secret ciftleriyle eklenir (bkz. add-account.sh).
# 4. hesap icin asagidaki env'e OCI_CONFIG_4 / OCI_KEY_4 satirlarini eklemek yeterli.
# Tum hesaplarda sunucu hazir olunca is kendini kapatir (yeniden: gh workflow enable catch-a1.yml).
name: Oracle A1 yakala

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # is bitince workflow'u kapatmak icin

concurrency:
  group: catch-a1
  cancel-in-progress: false

jobs:
  catch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Sunucu yakala
        id: catch
        env:
          OCI_CONFIG_1: ${{ secrets.OCI_CONFIG_1 }}
          OCI_KEY_1: ${{ secrets.OCI_KEY_1 }}
          OCI_CONFIG_2: ${{ secrets.OCI_CONFIG_2 }}
          OCI_KEY_2: ${{ secrets.OCI_KEY_2 }}
          OCI_CONFIG_3: ${{ secrets.OCI_CONFIG_3 }}
          OCI_KEY_3: ${{ secrets.OCI_KEY_3 }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          SSH_PUB: ${{ runner.temp }}/a1.pub
        run: |
          sec() { [ -z "${!1:-}" ] || printf '%s\n' "${!1}"; }
          ACCOUNTS=""
          for v in ${!OCI_CONFIG_@}; do
            if [ -n "${!v}" ]; then ACCOUNTS="$ACCOUNTS ${v#OCI_CONFIG_}"; fi
          done
          if [ -z "$ACCOUNTS" ] || [ -z "$SSH_PUBLIC_KEY" ]; then
            echo "::warning::Hesap ya da SSH_PUBLIC_KEY secret'i tanimli degil (bkz. README), atlaniyor"
            exit 0
          fi
          pip install --quiet --disable-pip-version-check oci-cli
          sec SSH_PUBLIC_KEY > "$SSH_PUB"

          all_ready=1; failed=0
          for n in $ACCOUNTS; do
            dir="$RUNNER_TEMP/hesap-$n"; mkdir -p "$dir"
            if [ -z "$(sec "OCI_KEY_$n")" ]; then
              echo "::error::Hesap $n: OCI_KEY_$n secret'i yok"; all_ready=0; failed=1; continue
            fi
            sec "OCI_KEY_$n" > "$dir/key.pem"
            # Oracle'in "Configuration file preview" metni; key_file satiri bizimkiyle degisir
            cfg=$(sec "OCI_CONFIG_$n" | tr -d '\r' | grep -v '^[[:space:]]*key_file')
            grep -q '^[[:space:]]*\[' <<<"$cfg" || cfg=$(printf '[DEFAULT]\n%s' "$cfg")
            printf '%s\nkey_file=%s\n' "$cfg" "$dir/key.pem" > "$dir/config"
            chmod 600 "$dir/key.pem" "$dir/config"

            echo "::group::Hesap $n"
            rc=0; OCI_CLI_CONFIG_FILE="$dir/config" ./catch-a1.sh --once || rc=$?
            echo "::endgroup::"
            case "$rc" in
              0) echo "Hesap $n: sunucu hazir" ;;
              10) echo "Hesap $n: henuz kapasite yok"; all_ready=0 ;;
              *) echo "::error::Hesap $n: cikis kodu $rc, grubun icindeki HATA satirina bak"; all_ready=0; failed=1 ;;
            esac
          done
          if [ "$all_ready" = 1 ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; fi
          exit "$failed"

      - name: Tum hesaplarda sunucu hazir, zamanlamayi kapat
        if: steps.catch.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable catch-a1.yml --repo "$GITHUB_REPOSITORY"
